services:

  postgres:
    image: postgres:18.1
    container_name: golf-postgres
    ports:
      - "9876:5432"
    env_file:
      - .env
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  golf-api:
    profiles: [app]
    build:
      context: ..
      dockerfile: api/Dockerfile
    ports:
      - "8080:8080"
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/golf
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/actuator/health || exit 1"]
      interval: 10s
      retries: 5

  golf-web:
    profiles: [app]
    build:
      context: ..
      dockerfile: web/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      golf-api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      API_BASE_URL: http://golf-api:8080
      AUTH0_BASE_URL: http://localhost:3000
      AUTH0_SCOPE: "openid profile email read:scorecard write:scorecard read:course write:course read:handicap"

volumes:
  postgres:
